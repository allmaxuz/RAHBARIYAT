<!DOCTYPE html>
<html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>ALLMAX · Marketing baza</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#f3f4f2;color:#0b0b0b;font-size:14px}
.h{background:#0b0b0b;color:#fff;padding:14px 16px 12px;position:sticky;top:0;z-index:5}
.t{font-size:11px;letter-spacing:.08em;color:#a1a1aa}
.row1{display:flex;justify-content:space-between;align-items:center}
.row1 b{font-size:18px;font-weight:800}
#yan{background:#27272a;border:0;color:#fff;border-radius:10px;padding:7px 11px;font-size:14px}
.chips,.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.chips{margin-top:12px}.chips::-webkit-scrollbar,.tabs::-webkit-scrollbar{display:none}
.c{flex:none;padding:0 12px;height:36px;border-radius:18px;border:1px solid #52525b;background:transparent;color:#e5e7eb;font:inherit;font-size:13px}
.c.on{background:#22c55e;color:#0b0b0b;border-color:#22c55e;font-weight:700}
#dn{font-size:12px;color:#a1a1aa;margin-top:10px}
.tabs{gap:2px;background:#fff;border-bottom:1px solid #e5e7eb;padding:0 8px;position:sticky;top:var(--hh,130px);z-index:4}
.tb{flex:none;padding:0 10px;height:44px;border:0;background:none;font:inherit;font-size:13px;color:#52525b;border-bottom:3px solid transparent}
.tb.on{color:#0b0b0b;font-weight:700;border-bottom-color:#16a34a}
#E{padding:12px 16px 40px;display:flex;flex-direction:column;gap:12px}
.g{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.k{background:#fff;border-radius:12px;padding:12px;border:1px solid #e5e7eb}
.kl{font-size:12px;color:#52525b}.kv{font-size:21px;font-weight:800;margin-top:2px;word-break:break-word}
.up{font-size:12px;font-weight:600;color:#15803d}.dn{font-size:12px;font-weight:600;color:#b91c1c}.nu{font-size:12px;color:#71717a}
.src{font-size:11px;color:#71717a}
.card{background:#fff;border-radius:12px;padding:14px;border:1px solid #e5e7eb}
.h2{font-size:14px;font-weight:700;margin:0 0 8px}
.r{display:flex;justify-content:space-between;gap:8px;font-size:13px;padding:8px 0;border-bottom:1px solid #f0f0f0}
.st{display:flex;height:34px;border-radius:8px;overflow:hidden;font-size:12px;font-weight:700;color:#fff}
.st div{display:flex;align-items:center;justify-content:center;white-space:nowrap}
.nt{font-size:12px;background:#fee2e2;color:#7f1d1d;border-radius:8px;padding:10px 12px}
.wr{font-size:12px;background:#fef3c7;color:#92400e;border-radius:8px;padding:10px 12px}
.bars{display:flex;align-items:flex-end;gap:2px;height:70px}.bars i{flex:1;background:#16a34a;border-radius:2px 2px 0 0;min-height:2px}
.yuk{text-align:center;color:#71717a;padding:40px}
.xato{background:#fee2e2;border:1px solid #fca5a5;color:#7f1d1d;border-radius:12px;padding:12px}
#sh{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-end;z-index:20}
#sh.on{display:flex}
#sh div{background:#fff;width:100%;border-radius:16px 16px 0 0;padding:18px 16px 24px;display:flex;flex-direction:column;gap:10px}
#sh input{width:100%;min-width:0;height:44px;border:1px solid #d4d4d8;border-radius:10px;padding:0 10px;font:inherit;accent-color:#16a34a}
#sh button{height:46px;border:0;border-radius:12px;font:inherit;font-weight:700;background:#22c55e;color:#0b0b0b}
</style></head><body>
<div class="h" id="H">
 <div class="row1"><div><div class="t">ALLMAX FIX PRICE</div><b>MARKETING BAZA</b></div><button id="yan">🔄</button></div>
 <div class="chips" id="C"></div>
 <div id="dn"></div>
</div>
<div class="tabs" id="T"></div>
<div id="E"><div class="yuk">⏳ Yuklanmoqda…</div></div>
<div id="sh"><div><b>Sana oralig'i</b><label class="src">Boshlanishi</label><input type="date" id="d1"><label class="src">Tugashi</label><input type="date" id="d2"><button id="ok">Ko'rsatish</button><button id="yop" style="background:#e5e7eb">Bekor</button></div></div>
<script>
const W = window.Telegram && Telegram.WebApp; try { W && (W.ready(), W.expand()); } catch (e) {}
const E = document.getElementById('E');
const API_URL = (() => { const q = new URLSearchParams(location.search); let u = q.get('api') || ''; try { if (u) localStorage.setItem('mb_api', u); else u = localStorage.getItem('mb_api') || ''; } catch (e) {} return u; })();
const INIT = (W && W.initData) || '';
const DAVRLAR = [['bugun', 'Bugun'], ['kecha', 'Kecha'], ['7kun', '7 kun'], ['30kun', '30 kun'], ['shuoy', 'Shu oy'], ['otganoy', "O'tgan oy"], ['oraliq', "Sana oralig'i"]];
const TABLAR = [['asosiy', 'Asosiy'], ['savdo', 'Savdo'], ['onlayn', 'Onlayn'], ['reklama', 'Reklama'], ['kontent', 'Kontent'], ['tovar', 'Tovar'], ['mijoz', 'Mijoz']];
let DAVR = '7kun', TAB = 'asosiy', A0 = '', B0 = '', R = null;
const esc = s => String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
/* formatlar */
const F = {
  int: v => String(Math.round(v)).replace(/\B(?=(\d{3})+(?!\d))/g, ' '),
  mln: v => Math.abs(v) >= 1e6 ? (Math.round(v / 1e5) / 10).toFixed(1).replace('.', ',') + ' mln' : F.int(v),
  usd: v => '$' + (Math.round(v * 100) / 100).toFixed(2).replace('.', ','),
  pct: v => (Math.round(v * 10) / 10).toFixed(1).replace('.', ',') + '%',
  d2: v => (Math.round(v * 100) / 100).toFixed(2).replace('.', ',')
};
/* ko'rsatkich: [kalit, nom, format, teskari(oshishi yomon), izoh] */
const KO = {
  asosiy: [['sof', 'Sof savdo', 'mln'], ['chek', 'Cheklar', 'int'], ['yozgan', 'Onlayn yozganlar', 'int'], ['sarf', 'Reklama sarfi', 'usd', 1], ['tulush', 'Tirox savdo ulushi', 'pct'], ['obuna', "Obunachi o'sishi", 'int']],
  savdo: [['sof', 'Sof savdo', 'mln'], ['chek', 'Cheklar', 'int'], ['ochek', "O'rtacha chek", 'int'], ['qayt', 'Qaytarish', 'mln', 1], ['kirgan', 'TASS kirgan mijoz', 'int'], ['konv', 'Konversiya', 'pct']],
  onlayn: [['yozgan', 'Yozganlar', 'int'], ['igy', 'Instagram', 'int'], ['tgy', 'Telegram', 'int'], ['yangi', 'Yangi mijoz', 'int'], ['eski', 'Eski mijoz', 'int'], ['eskiUlush', 'Eski mijoz ulushi', 'pct'], ['tsms', 'Target SMS', 'int'], ['org', 'Organik', 'int'], ['dast', 'Dastafka soni', 'int'], ['dsum', 'Dastafka summasi', 'mln']],
  reklama: [['sarf', 'Sarf', 'usd', 1], ['kor', "Ko'rsatish", 'int'], ['qam', 'Qamrov', 'int'], ['klik', 'Klik', 'int'], ['ctr', 'CTR', 'pct'], ['xabar', 'Xabar yozdi', 'int'], ['xabarNarx', '1 xabar narxi', 'usd', 1], ['cpl', '1 Target SMS (CPL)', 'usd', 1], ['cpa', '1 dastafka (CPA)', 'usd', 1], ['roas', 'ROAS', 'd2']],
  kontent: [['aqam', 'Akkaunt qamrovi', 'int'], ['akor', "Ko'rishlar", 'int'], ['prof', 'Profilga kirish', 'int'], ['obuna', "Obunachi o'sishi", 'int'], ['reels', 'Reels soni', 'int'], ['rkor', "Reels ko'rishlari", 'int'], ['story', 'Story soni', 'int']],
  mijoz: [['tulush', 'Tirox savdo ulushi', 'pct'], ['tsav', 'Tirox savdosi', 'mln'], ['tchek', 'Tirox bilan cheklar', 'int'], ['tchekUlush', 'Cheklar ichida ulushi', 'pct'], ['tyangi', 'Yangi Tirox karta', 'int'], ['qaytgan', 'Kartali: qaytganlar', 'pct']]
};
const MANBA = {
  asosiy: 'Manba: MoySklad, CM BAZA, KONTENT (Meta).', savdo: 'Manba: MoySklad savdo + TASS.', onlayn: 'Manba: CM BAZA «db Kun».',
  reklama: "Manba: KONTENT «Reklama» (Meta). CPL = sarf ÷ Target SMS; CPA = sarf ÷ dastafka soni. ROAS: dastafka savdosi ÷ reklama sarfi (kurs Markaziy bankdan yoki botdagi /kurs dan).",
  kontent: 'Manba: KONTENT «Akkaunt kunlik» va «Savdo».', mijoz: 'Manba: KONTENT «Savdo» (Tirox karta) ÷ MoySklad savdo.'
};
function api(metod, a) {
  if (!API_URL) return Promise.reject(new Error("Ulanish manzili yo'q. Ilovani bot ichidagi «Hisobot» tugmasidan oching"));
  return fetch(API_URL, { method: 'POST', body: JSON.stringify({ init: INIT, metod, a: a || {} }) })
    .then(r => { if (!r.ok) throw new Error('Server javob bermadi (' + r.status + ')'); return r.json(); })
    .then(j => { if (!j.ok) throw new Error(j.xato); return j.r; })
    .catch(e => { throw new Error(/Failed to fetch|NetworkError|Load failed/i.test(e.message) ? "Internet yoki server bilan aloqa yo'q — qayta urinib ko'ring" : e.message); });
}
const qs = s => { const m = String(s).match(/^(\d{4})-(\d{2})-(\d{2})/); return m ? m[3] + '.' + m[2] : s; };
const dr = (a, b) => a === b ? qs(a) : qs(a) + ' – ' + qs(b);
function kart(r, [k, nom, fm, ters]) {
  const x = r.k[k]; if (!x) return '';
  if (x.q == null) return '<div class="k"><div class="kl">' + esc(nom) + '</div><div class="kv">—</div><div class="nu">ma\'lumot yo\'q</div></div>';
  let d = '';
  if (x.p != null) { const yaxshi = ters ? x.p < 0 : x.p > 0, c = x.p === 0 ? 'nu' : yaxshi ? 'up' : 'dn'; d = '<div class="' + c + '">' + (x.p > 0 ? '+' : '') + String(x.p).replace('.', ',') + '%</div>'; }
  else if (x.o != null) d = '<div class="nu">oldin ' + esc(F[fm](x.o)) + '</div>';
  else d = '<div class="nu">oldingi davr: ma\'lumot yo\'q</div>';
  return '<div class="k"><div class="kl">' + esc(nom) + '</div><div class="kv">' + esc(F[fm](x.q)) + '</div>' + d + '</div>';
}
function qatorSeriya(r) {
  const s = r.seriya.filter(x => x.s != null); if (s.length < 2) return '';
  const mx = Math.max.apply(null, s.map(x => x.s)) || 1;
  return '<div class="card"><div class="h2">Kunlik sof savdo</div><div class="bars">' + s.map(x => '<i title="' + esc(x.d) + '" style="height:' + Math.max(3, Math.round(x.s / mx * 100)) + '%"></i>').join('') + '</div><div class="src" style="margin-top:6px">' + esc(qs(s[0].d)) + ' → ' + esc(qs(s[s.length - 1].d)) + '</div></div>';
}
function ogoh(r) {
  let h = '';
  if (r.qamrov.o < r.uz || r.qamrov.a < r.uz) h += '<div class="wr">⚠️ Savdo ma\'lumoti: tanlangan davrda ' + r.qamrov.a + '/' + r.uz + ' kun, oldingi davrda ' + r.qamrov.o + '/' + r.uz + ' kun bor. Kam kunli davr bilan solishtirish to\'liq emas.</div>';
  return h;
}
function chizKichik(r) {
  document.getElementById('dn').textContent = dr(r.a, r.b) + ' · oldingi ' + dr(r.pa, r.pb) + ' bilan · yangilandi ' + r.yangilandi;
  let h = ogoh(r);
  h += '<div class="g">' + KO[TAB].map(x => kart(r, x)).join('') + '</div><div class="src" style="margin-top:-4px">' + esc(MANBA[TAB]) + '</div>';
  if (TAB === 'asosiy') h += qatorSeriya(r);
  if (TAB === 'savdo') h += qatorSeriya(r);
  if (TAB === 'onlayn') {
    const y = r.k.yangi.q, e = r.k.eski.q;
    if (y != null && e != null && y + e > 0) { const p = Math.round(y / (y + e) * 100); h += '<div class="card"><div class="h2">Yozganlar orasida eski mijoz</div><div class="st"><div style="width:' + p + '%;background:#52525b">Yangi ' + esc(F.int(y)) + '</div><div style="width:' + (100 - p) + '%;background:#16a34a">Eski ' + esc(F.int(e)) + '</div></div></div>'; }
  }
  if (TAB === 'reklama' && r.k.roas.q == null) h += '<div class="wr">ROAS hisoblanmadi: dollar kursi aniqlanmadi. Botga /kurs 12700 deb yozing.</div>';
  if (TAB === 'mijoz') h += '<div class="nt"><b>Umumiy qayta xarid ulushi (barcha cheklar ichida) hozir jadvallarda yo\'q.</b> Tirox faqat karta bilan kelganlarni biladi. Kartasiz mijozning birinchi yoki qayta xaridini aniqlash uchun MoySklad chekida mijoz yozilgan bo\'lishi kerak.</div>';
  E.innerHTML = h;
}
function chizTovar(t) {
  const x = t.xulosa || {}, n = v => v == null ? '—' : F.int(v);
  let h = '<div class="g"><div class="k"><div class="kl">Ombordagi tovar</div><div class="kv">' + n(x.jami) + '</div><div class="nu">dona</div></div><div class="k"><div class="kl">Tovar qatorlari</div><div class="kv">' + n(x.qator) + '</div><div class="nu">nomenklatura</div></div><div class="k"><div class="kl">Kam qoldiq</div><div class="kv">' + n(x.kam) + '</div><div class="nu">ta tovar</div></div><div class="k"><div class="kl">Minus qoldiq</div><div class="kv">' + n(x.minus) + '</div><div class="dn">xato bo\'lishi mumkin</div></div></div>';
  h += '<div class="src" style="margin-top:-4px">Manba: MoySklad «Xulosa» · yangilandi ' + esc(t.yangilandi) + '</div>';
  const blok = (nom, arr, fn, izoh) => arr && arr.length ? '<div class="card"><div class="h2">' + nom + '</div>' + arr.map(a => '<div class="r"><span>' + esc(a.n) + (a.o ? ' · ' + esc(a.o) : '') + '</span>' + fn(a) + '</div>').join('') + '<div class="src" style="margin-top:6px">' + izoh + '</div></div>' : '';
  h += blok('Minus qoldiqli tovarlar', t.minus, a => '<b class="dn">' + F.int(a.q) + ' dona</b>', 'Manba: MoySklad «qoldiq».');
  h += blok('Qoldiq 0, sotuv bor', t.nol, a => '<span>7 kunda ' + F.int(a.s) + ' dona</span>', 'Manba: MoySklad «kam qoldiq».');
  h += blok('Tez tugaydigan', t.tez, a => '<b>' + F.int(a.q) + ' dona · ' + F.int(a.k) + ' kun</b>', 'Manba: MoySklad «tovar savdo» (davri MoySklad filtriga bog\'liq).');
  if (t.xato && t.xato.length) h += '<div class="wr">' + t.xato.map(esc).join('<br>') + '</div>';
  E.innerHTML = h;
}
async function yukla(yangi) {
  E.innerHTML = '<div class="yuk">⏳ Yuklanmoqda…</div>';
  try {
    if (TAB === 'tovar') { chizTovar(await api('tovar', { yangi: yangi ? 1 : 0 })); document.getElementById('dn').textContent = "Qoldiq: hozirgi holat"; return; }
    if (!R || R._k !== DAVR + A0 + B0 || yangi) { R = await api('hisobot', { davr: DAVR, a: A0, b: B0, yangi: yangi ? 1 : 0 }); R._k = DAVR + A0 + B0; }
    chizKichik(R);
  } catch (e) { E.innerHTML = '<div class="xato">❌ ' + esc(e.message) + '</div>'; }
}
function menyu() {
  document.getElementById('C').innerHTML = DAVRLAR.map(d => '<button class="c' + (d[0] === DAVR ? ' on' : '') + '" data-d="' + d[0] + '">' + d[1] + '</button>').join('');
  document.getElementById('T').innerHTML = TABLAR.map(d => '<button class="tb' + (d[0] === TAB ? ' on' : '') + '" data-t="' + d[0] + '">' + d[1] + '</button>').join('');
  document.querySelectorAll('.c').forEach(b => b.onclick = () => { if (b.dataset.d === 'oraliq') { document.getElementById('sh').classList.add('on'); return; } DAVR = b.dataset.d; A0 = B0 = ''; menyu(); yukla(false); });
  document.querySelectorAll('.tb').forEach(b => b.onclick = () => { TAB = b.dataset.t; menyu(); yukla(false); });
  document.documentElement.style.setProperty('--hh', document.getElementById('H').offsetHeight + 'px');
}
document.getElementById('yan').onclick = () => yukla(true);
document.getElementById('yop').onclick = () => document.getElementById('sh').classList.remove('on');
document.getElementById('ok').onclick = () => {
  const a = document.getElementById('d1').value, b = document.getElementById('d2').value;
  if (!a || !b) return;
  DAVR = 'oraliq'; A0 = a; B0 = b; document.getElementById('sh').classList.remove('on'); menyu(); yukla(false);
};
menyu(); yukla(false);
</script></body></html>
