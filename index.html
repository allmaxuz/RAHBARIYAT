<script>
const W = window.Telegram && Telegram.WebApp; try { W && (W.ready(), W.expand()); } catch (e) {}
const E = document.getElementById('E');
const API_URL = (() => { const q = new URLSearchParams(location.search); let u = q.get('api') || ''; try { if (u) localStorage.setItem('mb_api', u); else u = localStorage.getItem('mb_api') || ''; } catch (e) {} return u; })();
const INIT = (W && W.initData) || '';
const DAVRLAR = [['bugun', 'Bugun'], ['kecha', 'Kecha'], ['7kun', '7 kun'], ['30kun', '30 kun'], ['shuoy', 'Shu oy'], ['otganoy', "O'tgan oy"], ['oraliq', "Sana oralig'i"]];

let DAVR = '7kun', TAB = 'asosiy', A0 = '', B0 = '', R = null;
const esc = s => String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
/* formatlar */
const F = {

function api(metod, a) {
  if (!API_URL) return Promise.reject(new Error("Ulanish manzili yo'q. Ilovani bot ichidagi «Hisobot» tugmasidan oching"));

    .then(j => { if (!j.ok) throw new Error(j.xato); return j.r; })
    .catch(e => { throw new Error(/Failed to fetch|NetworkError|Load failed/i.test(e.message) ? "Internet yoki server bilan aloqa yo'q — qayta urinib ko'ring" : e.message); });

const dr = (a, b) => a === b ? qs(a) : qs(a) + ' – ' + qs(b);
function kart(r, [k, nom, fm, ters]) {
  const ort = x => (JAMI.has(k) && r.uz > 1 && x.q != null) ? '<div class="src">kuniga o\'rtacha ' + esc(F[fm](x.q / r.uz)) + '</div>' : '';
  const x = r.k[k]; if (!x) return '';
  if (x.q == null) return '<div class="k"><div class="kl">' + esc(nom) + '</div><div class="kv">—</div><div class="nu">ma\'lumot yo\'q</div></div>';

  if (x.p != null) { const yaxshi = ters ? x.p < 0 : x.p > 0, c = x.p === 0 ? 'nu' : yaxshi ? 'up' : 'dn'; d = '<div class="' + c + '">' + (x.p > 0 ? '+' : '') + String(x.p).replace('.', ',') + '%</div>'; }

function qatorSeriya(r) {
  const s = r.seriya.filter(x => x.s != null); if (s.length < 2) return '';
  const mx = Math.max.apply(null, s.map(x => x.s)) || 1;
  return '<div class="card"><div class="h2">Kunlik sof savdo</div><div class="bars">' + s.map(x => '<i title="' + esc(x.d) + '" style="height:' + Math.max(3, Math.round(x.s / mx * 100)) + '%"></i>').join('') + '</div><div class="src" style="margin-top:6px">' + esc(qs(s[0].d)) + ' → ' + esc(qs(s[s.length - 1].d)) + '</div></div>';
}
function ogoh(r) {
  let h = '';
  if (r.qamrov.o < r.uz || r.qamrov.a < r.uz) h += '<div class="wr">⚠️ Savdo ma\'lumoti: tanlangan davrda ' + r.qamrov.a + '/' + r.uz + ' kun, oldingi davrda ' + r.qamrov.o + '/' + r.uz + ' kun bor. Kam kunli davr bilan solishtirish to\'liq emas.</div>';
  return h;
}
function chizKichik(r) {
  document.getElementById('dn').textContent = dr(r.a, r.b) + ' · oldingi ' + dr(r.pa, r.pb) + ' bilan · yangilandi ' + r.yangilandi;
  let h = ogoh(r);
  h += '<div class="g">' + KO[TAB].map(x => kart(r, x)).join('') + '</div><div class="src" style="margin-top:-4px">' + esc(MANBA[TAB]) + '</div>';
  if (TAB === 'asosiy') h += qatorSeriya(r);

  if (TAB === 'onlayn') {
    const y = r.k.yangi.q, e = r.k.eski.q;
    if (y != null && e != null && y + e > 0) { const p = Math.round(y / (y + e) * 100); h += '<div class="card"><div class="h2">Yozganlar orasida eski mijoz</div><div class="st"><div style="width:' + p + '%;background:#52525b">Yangi ' + esc(F.int(y)) + '</div><div style="width:' + (100 - p) + '%;background:#16a34a">Eski ' + esc(F.int(e)) + '</div></div></div>'; }

}
function tiroxHtml(t) {

      kk('Jami kartalar', n(H.jami)) + kk('Jami balans', F.mln(H.balans) + " so'm", "o'rtacha " + F.int(H.jami ? H.balans / H.jami : 0)) +
      kk('Kelgan (tashrif ≥ 1)', n(H.kelgan), 'qayta kelgan (≥ 2): ' + F.int(H.qayta) + (H.kelgan ? ' · ' + F.pct(H.qayta / H.kelgan * 100) : '')) +

      kk('40+ kun kelmagan', n(H.kelmagan), 'balansi ' + F.mln(H.kelmaganSum) + " so'm") +

  if (t.xato && t.xato.length) h += '<div class="wr">' + t.xato.map(esc).join('<br>') + '</div>';

const r_uz = t => t.uz > 1;

const FM = 'MoySklad+TASS fayli', FC = 'CM BAZA fayli', FK = 'KONTENT fayli';
